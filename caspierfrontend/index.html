<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CasperNote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              casper: {
                red: '#ff2d2e',
                white: '#ffffff',
                black: '#1a1a1a', // Keep for text legibility
                border: '#ff2d2e', // New utility for borders
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Geist', 'Neue Montreal', 'Space Grotesk', 'Inter', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
            },
            boxShadow: {
              'neo': '4px 4px 0px 0px #ff2d2e',
              'neo-hover': '6px 6px 0px 0px #ff2d2e',
              'neo-sm': '2px 2px 0px 0px #ff2d2e',
              'neo-black': '4px 4px 0px 0px #1a1a1a',
              'neo-black-hover': '6px 6px 0px 0px #1a1a1a',
              'neo-black-sm': '2px 2px 0px 0px #1a1a1a',
            },
            keyframes: {
              flow: {
                '0%': { 'stroke-dashoffset': '20' },
                '100%': { 'stroke-dashoffset': '0' }
              }
            },
            animation: {
              'flow': 'flow 1s linear infinite'
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f3f4f6;
        color: #1a1a1a;
      }
      /* Hide scrollbar for clean UI in sidebar */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      .connection-path {
        transition: stroke-width 0.2s, filter 0.2s;
      }
      .connection-group:hover .connection-path-outline {
        stroke: #ff2d2e;
        stroke-opacity: 0.1;
        stroke-width: 12px;
      }
      .connection-group:hover .connection-path-main {
        filter: drop-shadow(0px 0px 2px #ff2d2e);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
